<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareConnect Hospital</title>
<style>
:root{--p:#0f766e;--bg:#f1f5f9;--c:#fff;--t:#0f172a;--m:#64748b;--b:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--p);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px;margin:0}main{max-width:1000px;margin:24px auto;padding:0 16px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:20px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:17px}input,select,textarea,button{font:inherit;padding:9px 12px;border:1px solid var(--b);border-radius:8px;width:100%;margin-bottom:10px}
button{background:var(--p);color:#fff;border:0;cursor:pointer;width:auto}button.alt{background:#fff;color:var(--p);border:1px solid var(--p)}
button.red{background:#dc2626}header button{background:#fff;color:var(--p);margin:0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.slots button{margin:0;background:#fff;color:var(--t);border:1px solid var(--b)}
.slots button.sel{background:var(--p);color:#fff}.slots button:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 6px;border-bottom:1px solid var(--b);text-align:left}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;background:#ccfbf1}.tag.cancelled{background:#fee2e2}.tag.completed{background:#e0e7ff}
.rec{border-left:3px solid var(--p);padding:6px 12px;margin:10px 0;background:#f8fafc}.m{color:var(--m);font-size:13px}
#toast{position:fixed;bottom:20px;right:20px;background:var(--t);color:#fff;padding:12px 18px;border-radius:8px;display:none}
.hide{display:none}.live{font-size:12px;opacity:.9;margin-right:10px}
</style></head><body>
<header><h1>🏥 CareConnect Hospital</h1><div id="nav"></div></header>
<main id="app"></main><div id="toast"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=s=>document.querySelector(s), app=$('#app');
let token=localStorage.token||'', user=JSON.parse(localStorage.user||'null'), sel={}, openPatient=null;
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
async function api(url,method='GET',body){
  const r=await fetch('/api'+url,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body&&JSON.stringify(body)});
  const d=await r.json();if(!r.ok){toast(d.error||'Error');throw d}return d}
function logout(){localStorage.clear();token='';user=null;render()}
async function auth(kind){
  try{const d=await api('/'+kind,'POST',{name:$('#n')?.value,email:$('#em').value,password:$('#pw').value});
  token=d.token;user=d.user;localStorage.token=token;localStorage.user=JSON.stringify(user);render()}catch{}}
function render(){
  $('#nav').innerHTML=user?`<span class="live">● Live</span>${e(user.name)} (${user.role}) <button onclick="logout()">Logout</button>`:'';
  if(!user){app.innerHTML=`<div class="card" style="max-width:380px;margin:auto"><h2>Sign in or create a patient account</h2>
  <input id="n" placeholder="Full name (new patients only)"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password">
  <button onclick="auth('login')">Login</button> <button class="alt" onclick="auth('register')">Register</button>
  <p class="m">Demo staff: admin@hospital.com / Admin@123, anita@hospital.com / Doctor@123</p></div>`;return}
  user.role==='patient'?patientView():staffView()}
const tbl=(rows,staffMode)=>`<table><tr><th>Date</th><th>Time</th><th>${staffMode?'Patient':'Doctor'}</th><th>Reason</th><th>Status</th><th></th></tr>`+
 rows.map(a=>`<tr><td>${a.date}</td><td>${a.time}</td><td>${e(staffMode?a.patient:a.doctor)}</td><td>${e(a.reason)}</td><td><span class="tag ${a.status}">${a.status}</span></td><td>`+
 (a.status==='booked'?(staffMode&&user.role==='doctor'?`<button onclick="setStatus('${a.id}','completed')">Complete</button> `:'')+`<button class="red" onclick="setStatus('${a.id}','cancelled')">Cancel</button>`:'')+`</td></tr>`).join('')+'</table>';
async function setStatus(id,s){await api('/appointments/'+id,'PATCH',{status:s});refresh()}
async function patientView(){
  const docs=await api('/doctors');sel.doctor=sel.doctor||docs[0]?.id;sel.date=sel.date||new Date().toISOString().slice(0,10);
  app.innerHTML=`<div class="card"><h2>Book an appointment</h2><div class="row">
  <select id="doc" onchange="sel.doctor=this.value;sel.time=null;refresh()">${docs.map(d=>`<option value="${d.id}" ${d.id===sel.doctor?'selected':''}>${e(d.name)} - ${e(d.specialty)}</option>`).join('')}</select>
  <input type="date" id="dt" min="${new Date().toISOString().slice(0,10)}" value="${sel.date}" onchange="sel.date=this.value;sel.time=null;refresh()"></div>
  <div class="slots" id="slots"></div><textarea id="why" rows="2" placeholder="Reason for visit"></textarea><button onclick="book()">Confirm booking</button></div>
  <div class="card"><h2>My appointments</h2><div id="mine"></div></div><div class="card"><h2>My medical records</h2><div id="recs"></div></div>`;refresh()}
async function book(){if(!sel.time)return toast('Select a time slot');
  await api('/appointments','POST',{doctorId:sel.doctor,date:sel.date,time:sel.time,reason:$('#why').value});sel.time=null;toast('Appointment booked');refresh()}
async function staffView(){
  app.innerHTML=`<div class="card"><h2>Appointments</h2><div id="mine"></div></div>
  <div class="card"><h2>Patient records</h2><input id="q" placeholder="Search patient by name or email" oninput="refresh()"><div id="plist"></div><div id="pdetail"></div></div>`;refresh()}
async function refresh(){
  if(!user)return;
  const mine=await api('/appointments');
  if($('#mine'))$('#mine').innerHTML=mine.length?tbl(mine,user.role!=='patient'):'<p class="m">No appointments yet.</p>';
  if(user.role==='patient'){
    if($('#slots')){const s=await api(`/slots?doctorId=${sel.doctor}&date=${sel.date}`);
      $('#slots').innerHTML=s.map(x=>`<button ${x.taken?'disabled':''} class="${x.time===sel.time?'sel':''}" onclick="sel.time='${x.time}';refresh()">${x.time}</button>`).join('')}
    if($('#recs'))$('#recs').innerHTML=recHtml(await api('/records/'+user.id))}
  else{
    const p=await api('/patients?q='+encodeURIComponent($('#q')?.value||''));
    $('#plist').innerHTML=p.map(x=>`<button class="alt" onclick="openPatient='${x.id}';refresh()">${e(x.name)}</button> `).join('')||'<p class="m">No patients found.</p>';
    if(openPatient){const r=await api('/records/'+openPatient);const nm=p.find(x=>x.id===openPatient)?.name||'';
      $('#pdetail').innerHTML=`<h2 style="margin-top:16px">Records: ${e(nm)}</h2>`+recHtml(r)+(user.role==='doctor'?
      `<input id="dx" placeholder="Diagnosis"><input id="rx" placeholder="Prescription"><textarea id="nt" rows="2" placeholder="Notes"></textarea><button onclick="addRec()">Save record</button>`:'')}}}
const recHtml=r=>r.length?r.map(x=>`<div class="rec"><b>${e(x.diagnosis)}</b><div class="m">${new Date(x.date).toLocaleString()} by ${e(x.doctor)}</div><div>Prescription: ${e(x.prescription)||'-'}</div><div>${e(x.notes)}</div></div>`).join(''):'<p class="m">No records yet.</p>';
async function addRec(){await api('/records/'+openPatient,'POST',{diagnosis:$('#dx').value,prescription:$('#rx').value,notes:$('#nt').value});toast('Record saved');refresh()}
io().on('update',()=>{refresh();});
render();
</script></body></html>
