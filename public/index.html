<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareConnect Enterprise</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">

<header class="bg-blue-900 text-white shadow-md sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold flex items-center gap-2 cursor-pointer" onclick="showPortal=false; render()">🏥 CareConnect</h1>
    <div id="nav" class="flex items-center gap-4"></div>
  </div>
</header>

<main id="app" class="max-w-6xl mx-auto px-4 py-8"></main>

<div id="toast" class="fixed bottom-4 right-4 bg-slate-800 text-white px-6 py-3 rounded-lg shadow-xl hidden transition-opacity z-50"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const $ = s => document.querySelector(s);
  const app = $('#app');
  let token = localStorage.token || '';
  let user = JSON.parse(localStorage.user || 'null');
  let sel = {}, openPatient = null;
  let showPortal = false; // Controls whether to show the login screen or public website

  const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  
  function toast(m) {
    const t = $('#toast');
    t.textContent = m;
    t.classList.remove('hidden');
    setTimeout(() => t.classList.add('hidden'), 3000);
  }

  async function api(url, method = 'GET', body) {
    const r = await fetch('/api' + url, {
      method,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: body && JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok) { toast(d.error || 'Error'); throw d; }
    return d;
  }

  function logout() { localStorage.clear(); token = ''; user = null; showPortal = false; render(); }

  async function auth(kind) {
    try {
      const d = await api('/' + kind, 'POST', { name: $('#n')?.value, email: $('#em').value, password: $('#pw').value });
      token = d.token; user = d.user;
      localStorage.token = token; localStorage.user = JSON.stringify(user);
      render();
    } catch {}
  }

  function render() {
    // Navigation Bar Logic
    $('#nav').innerHTML = user 
      ? `<span class="flex items-center gap-2 text-sm"><span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> Live</span>
         <span class="font-medium">${e(user.name)} <span class="opacity-75 text-sm">(${user.role})</span></span>
         <button onclick="logout()" class="ml-4 bg-white/10 hover:bg-white/20 px-4 py-2 rounded transition">Logout</button>`
      : `<button onclick="showPortal=true; render()" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded transition font-medium">Patient Login</button>`;

    if (!user) {
      if (!showPortal) {
        // --- PUBLIC LANDING PAGE ---
        app.innerHTML = `
          <div class="text-center py-20 bg-blue-100 rounded-2xl mb-12 shadow-sm border border-blue-200">
            <h1 class="text-4xl md:text-5xl font-bold text-slate-800 mb-6">World-Class Healthcare, Closer to You</h1>
            <p class="text-lg text-slate-600 mb-10 max-w-2xl mx-auto">Experience seamless scheduling, digital health records, and top-tier medical experts all in one secure platform.</p>
            <button onclick="showPortal=true; render()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-10 rounded-full shadow-lg transition transform hover:scale-105 text-lg">
              Book an Appointment
            </button>
          </div>
          
          <h2 class="text-2xl font-bold text-center text-slate-800 mb-8">Our Centres of Excellence</h2>
          <div class="grid md:grid-cols-3 gap-8 mb-12">
             <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center hover:shadow-md transition cursor-pointer">
               <div class="text-4xl mb-4">🫀</div>
               <h3 class="font-bold text-lg mb-2">Cardiac Sciences</h3>
               <p class="text-slate-500 text-sm">Advanced heart care, diagnostics, and treatments by expert cardiologists.</p>
             </div>
             <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center hover:shadow-md transition cursor-pointer">
               <div class="text-4xl mb-4">🧠</div>
               <h3 class="font-bold text-lg mb-2">Neurosciences</h3>
               <p class="text-slate-500 text-sm">Comprehensive care for brain, spine, and nervous system disorders.</p>
             </div>
             <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center hover:shadow-md transition cursor-pointer">
               <div class="text-4xl mb-4">🩺</div>
               <h3 class="font-bold text-lg mb-2">General Medicine</h3>
               <p class="text-slate-500 text-sm">Primary care, routine checkups, and advanced preventive medicine.</p>
             </div>
          </div>
        `;
      } else {
        // --- LOGIN & REGISTRATION PORTAL ---
        app.innerHTML = `
          <div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-slate-200 mt-10 relative">
            <button onclick="showPortal=false; render()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-sm font-medium">✕ Cancel</button>
            <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center">Portal Access</h2>
            <div class="space-y-4">
              <input id="n" placeholder="Full name (new patients)" class="w-full p-3 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
              <input id="em" type="email" placeholder="Email Address" class="w-full p-3 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
              <input id="pw" type="password" placeholder="Password" class="w-full p-3 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
              <div class="flex gap-4 pt-2">
                <button onclick="auth('login')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded transition">Login</button>
                <button onclick="auth('register')" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded transition border border-slate-300">Register</button>
              </div>
            </div>
          </div>`;
      }
      return;
    }
    // Render Dashboards if logged in
    user.role === 'patient' ? patientView() : staffView();
  }

  const getStatusBadge = (status) => {
    const colors = { booked: 'bg-amber-100 text-amber-800', completed: 'bg-emerald-100 text-emerald-800', cancelled: 'bg-red-100 text-red-800' };
    return `<span class="px-3 py-1 rounded-full text-xs font-semibold ${colors[status]}">${status.toUpperCase()}</span>`;
  };

  const tbl = (rows, staffMode) => `
    <div class="overflow-x-auto bg-white rounded-lg shadow-sm border border-slate-200">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm uppercase tracking-wider">
            <th class="p-4 font-semibold">Date & Time</th>
            <th class="p-4 font-semibold">${staffMode ? 'Patient' : 'Doctor'}</th>
            <th class="p-4 font-semibold">Reason</th>
            <th class="p-4 font-semibold">Status</th>
            <th class="p-4 font-semibold text-right">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          ${rows.map(a => `
            <tr class="hover:bg-slate-50 transition">
              <td class="p-4"><div class="font-medium">${a.date.split('T')[0]}</div><div class="text-slate-500 text-sm">${a.time}</div></td>
              <td class="p-4 font-medium text-slate-800">${e(staffMode ? a.patient : a.doctor)}</td>
              <td class="p-4 text-slate-600 text-sm">${e(a.reason)}</td>
              <td class="p-4">${getStatusBadge(a.status)}</td>
              <td class="p-4 text-right space-x-2">
                ${a.status === 'booked' ? `
                  ${staffMode && user.role === 'doctor' ? `<button onclick="setStatus('${a.id}','completed')" class="text-emerald-600 hover:text-emerald-800 font-medium text-sm">Complete</button>` : ''}
                  <button onclick="setStatus('${a.id}','cancelled')" class="text-red-600 hover:text-red-800 font-medium text-sm">Cancel</button>
                ` : ''}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>`;

  async function setStatus(id, s) { await api('/appointments/' + id, 'PATCH', { status: s }); refresh(); }

  async function patientView() {
    const docs = await api('/doctors');
    sel.doctor = sel.doctor || docs[0]?.id; sel.date = sel.date || new Date().toISOString().slice(0, 10);
    app.innerHTML = `
      <div class="grid md:grid-cols-3 gap-8">
        <div class="md:col-span-1 space-y-6">
          <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-800 mb-4">Book Appointment</h2>
            <select id="doc" onchange="sel.doctor=this.value;sel.time=null;refresh()" class="w-full p-3 mb-4 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
              ${docs.map(d => `<option value="${d.id}" ${d.id === sel.doctor ? 'selected' : ''}>${e(d.name)} (${e(d.specialty)})</option>`).join('')}
            </select>
            <input type="date" id="dt" min="${new Date().toISOString().slice(0, 10)}" value="${sel.date}" onchange="sel.date=this.value;sel.time=null;refresh()" class="w-full p-3 mb-4 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
            <div id="slots" class="grid grid-cols-3 gap-2 mb-4"></div>
            <textarea id="why" rows="2" placeholder="Reason for visit" class="w-full p-3 mb-4 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            <button onclick="book()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded transition">Confirm Booking</button>
          </div>
        </div>
        <div class="md:col-span-2 space-y-8">
          <section>
            <h2 class="text-xl font-bold text-slate-800 mb-4">My Appointments</h2>
            <div id="mine"></div>
          </section>
          <section>
            <h2 class="text-xl font-bold text-slate-800 mb-4">Medical Records</h2>
            <div id="recs" class="space-y-4"></div>
          </section>
        </div>
      </div>`;
    refresh();
  }

  async function book() {
    if (!sel.time) return toast('Select a time slot');
    await api('/appointments', 'POST', { doctorId: sel.doctor, date: sel.date, time: sel.time, reason: $('#why').value });
    sel.time = null; toast('Appointment booked'); refresh();
  }

  async function staffView() {
    app.innerHTML = `
      <div class="space-y-8">
        <section>
          <h2 class="text-xl font-bold text-slate-800 mb-4">Active Appointments</h2>
          <div id="mine"></div>
        </section>
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
          <h2 class="text-xl font-bold text-slate-800 mb-4">Patient Directory</h2>
          <input id="q" placeholder="Search patient name..." oninput="refresh()" class="w-full md:w-1/2 p-3 mb-6 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
          <div id="plist" class="flex flex-wrap gap-2 mb-6"></div>
          <div id="pdetail" class="mt-6 border-t border-slate-100 pt-6"></div>
        </section>
      </div>`;
    refresh();
  }

  async function refresh() {
    if (!user) return;
    const mine = await api('/appointments');
    if ($('#mine')) $('#mine').innerHTML = mine.length ? tbl(mine, user.role !== 'patient') : '<p class="text-slate-500 bg-white p-4 rounded-lg border border-slate-200">No appointments scheduled.</p>';
    
    if (user.role === 'patient') {
      if ($('#slots')) {
        const s = await api(`/slots?doctorId=${sel.doctor}&date=${sel.date}`);
        $('#slots').innerHTML = s.map(x => `
          <button ${x.taken ? 'disabled' : ''} 
            class="py-2 text-sm rounded border transition ${x.taken ? 'bg-slate-100 text-slate-400 cursor-not-allowed line-through' : x.time === sel.time ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-700 hover:border-blue-500 border-slate-300'}" 
            onclick="sel.time='${x.time}';refresh()">
            ${x.time}
          </button>`).join('');
      }
      if ($('#recs')) $('#recs').innerHTML = recHtml(await api('/records/' + user.id));
    } else {
      const p = await api('/patients?q=' + encodeURIComponent($('#q')?.value || ''));
      $('#plist').innerHTML = p.map(x => `<button class="px-4 py-2 bg-slate-100 hover:bg-blue-50 hover:text-blue-700 border border-slate-200 rounded-full text-sm font-medium transition" onclick="openPatient='${x.id}';refresh()">${e(x.name)}</button>`).join('') || '<p class="text-slate-500">No patients found.</p>';
      
      if (openPatient) {
        const r = await api('/records/' + openPatient);
        const nm = p.find(x => x.id === openPatient)?.name || '';
        $('#pdetail').innerHTML = `
          <h3 class="text-lg font-bold text-slate-800 mb-4">Records for ${e(nm)}</h3>
          <div class="space-y-4 mb-6">${recHtml(r)}</div>
          ${user.role === 'doctor' ? `
            <div class="bg-slate-50 p-6 rounded-lg border border-slate-200 space-y-4">
              <h4 class="font-semibold text-slate-700">Add New Record</h4>
              <input id="dx" placeholder="Diagnosis" class="w-full p-3 border border-slate-300 rounded outline-none focus:ring-2 focus:ring-blue-500">
              <input id="rx" placeholder="Prescription" class="w-full p-3 border border-slate-300 rounded outline-none focus:ring-2 focus:ring-blue-500">
              <textarea id="nt" rows="2" placeholder="Clinical Notes" class="w-full p-3 border border-slate-300 rounded outline-none focus:ring-2 focus:ring-blue-500"></textarea>
              <button onclick="addRec()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-6 rounded transition">Save Record</button>
            </div>
          ` : ''}`;
      }
    }
  }

  const recHtml = r => r.length ? r.map(x => `
    <div class="bg-white p-5 rounded-lg border-l-4 border-l-blue-500 shadow-sm border-y border-r border-slate-200">
      <div class="flex justify-between items-start mb-2">
        <h4 class="font-bold text-slate-800 text-lg">${e(x.diagnosis)}</h4>
        <span class="text-xs text-slate-500 bg-slate-100 px-2 py-1 rounded">${new Date(x.created_at).toLocaleDateString()}</span>
      </div>
      <p class="text-sm text-slate-600 mb-2"><span class="font-medium text-slate-700">Rx:</span> ${e(x.prescription) || 'None'}</p>
      <p class="text-sm text-slate-600"><span class="font-medium text-slate-700">Notes:</span> ${e(x.notes) || 'None'}</p>
      <p class="text-xs text-slate-400 mt-3 pt-3 border-t border-slate-100">Attending: ${e(x.doctor_name)}</p>
    </div>
  `).join('') : '<p class="text-slate-500 bg-slate-50 p-4 rounded-lg border border-slate-200">No medical history available.</p>';

  async function addRec() { await api('/records/' + openPatient, 'POST', { diagnosis: $('#dx').value, prescription: $('#rx').value, notes: $('#nt').value }); toast('Record saved'); refresh(); }

  io().on('update', () => { refresh(); });
  render();
</script>
</body>
</html>
